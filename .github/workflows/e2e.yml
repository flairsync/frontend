name: e2e (staging)

# KAN-71 round 5: guest-ordering.spec.ts and no-raw-i18n-keys.spec.ts need a real deployment
# with seeded data (a published business, a table, an owner account — see e2e/README.md), so
# this runs on demand against a given BASE_URL rather than on every push/PR.
on:
  workflow_dispatch:
    inputs:
      base_url:
        description: "Environment to test against"
        required: true
        default: "https://staging.flairsync.com"

jobs:
  e2e:
    runs-on: ubuntu-latest
    env:
      BASE_URL: ${{ inputs.base_url }}
      E2E_BUSINESS_SLUG: ${{ vars.E2E_BUSINESS_SLUG }}
      E2E_TABLE_ID: ${{ vars.E2E_TABLE_ID }}
      E2E_OWNER_EMAIL: ${{ secrets.E2E_OWNER_EMAIL }}
      E2E_OWNER_PASSWORD: ${{ secrets.E2E_OWNER_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
